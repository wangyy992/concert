<style>
:root{
  --bg:#0b0b12; --panel:#14141f; --panel-2:#1b1b28; --panel-3:#22222f;
  --line:#2c2c3d; --line-soft:#232332;
  --text:#edecf3; --muted:#9695ad; --muted-2:#6f6e86;
  --itzy:#ff3d7f; --lsf:#5b86ff;
  --good:#34d399;
  --r:14px; --r-sm:9px;
  --disp:"Bricolage Grotesque", "Archivo", system-ui, sans-serif;
  --body:"Archivo", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--body);
  font-size:14px; line-height:1.45;
  padding-bottom:96px;
  min-height:100vh;
  background-image:
    radial-gradient(60vw 40vh at 15% -10%, rgba(255,61,127,.16), transparent 70%),
    radial-gradient(60vw 40vh at 85% -10%, rgba(91,134,255,.16), transparent 70%);
  background-attachment:fixed;
}
::selection{background:rgba(255,61,127,.35);}
h1,h2,h3{font-family:var(--disp); margin:0; letter-spacing:-.01em;}
button,input,select,textarea{font-family:inherit;}

/* ---- top bar ---- */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:14px;
  padding:14px 22px;
  background:rgba(11,11,18,.72);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{font-family:var(--disp); font-weight:800; font-size:20px; white-space:nowrap; display:flex; align-items:center; gap:9px;}
.brand .dot{
  background:linear-gradient(120deg,var(--itzy),var(--lsf));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.concert-name{
  flex:1; min-width:120px;
  background:var(--panel-2); border:1px solid var(--line); color:var(--text);
  padding:10px 14px; border-radius:var(--r-sm); font-size:15px; font-weight:500;
}
.concert-name::placeholder{color:var(--muted-2);}
.concert-name:focus{outline:none; border-color:var(--itzy);}
.top-actions{display:flex; gap:8px;}

/* ---- buttons ---- */
.btn{
  background:var(--panel-2); border:1px solid var(--line); color:var(--text);
  padding:9px 14px; border-radius:var(--r-sm); cursor:pointer; font-size:13px; font-weight:500;
  transition:.15s; white-space:nowrap;
}
.btn:hover{border-color:var(--muted); background:var(--panel-3);}
.btn:focus-visible{outline:2px solid var(--lsf); outline-offset:2px;}
.btn-primary{
  background:linear-gradient(120deg,var(--itzy),#ff5c93); border:none; color:#fff; font-weight:700;
  box-shadow:0 4px 18px rgba(255,61,127,.35);
}
.btn-primary:hover{filter:brightness(1.07); background:linear-gradient(120deg,var(--itzy),#ff5c93);}
.btn-ghost{background:transparent;}
.btn.mini{padding:4px 9px; font-size:12px; border-radius:7px;}
a.btn{display:inline-flex; align-items:center; text-decoration:none;}

/* ---- layout ---- */
.layout{
  display:grid; grid-template-columns:1fr 1.05fr; gap:18px;
  padding:20px 22px; max-width:1440px; margin:0 auto;
}
@media(max-width:920px){.layout{grid-template-columns:1fr;}}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:16px;}
.panel-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; flex-wrap:wrap;}
.panel-head h2{font-size:15px; text-transform:uppercase; letter-spacing:.14em; color:var(--muted); font-weight:600; font-family:var(--body);}

/* ---- group tabs ---- */
.group-tabs{display:flex; gap:7px;}
.group-tab{
  padding:6px 15px; border-radius:20px; cursor:pointer; font-size:13px; font-weight:600;
  border:1px solid var(--line); background:var(--panel-2); color:var(--muted); transition:.15s;
}
.group-tab.active{color:#fff; border-color:transparent;}

.search{
  width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
  padding:10px 14px; border-radius:var(--r-sm); margin-bottom:12px;
}
.search:focus{outline:none; border-color:var(--lsf);}
.search::placeholder{color:var(--muted-2);}

/* ---- albums ---- */
.album-list{display:flex; flex-direction:column; gap:9px; max-height:64vh; overflow-y:auto; padding-right:5px;}
.album-list::-webkit-scrollbar{width:9px;}
.album-list::-webkit-scrollbar-thumb{background:var(--line); border-radius:20px;}
.album{border:1px solid var(--line-soft); border-radius:12px; overflow:hidden; background:var(--panel-2);}
.album-head{display:flex; align-items:center; gap:12px; padding:11px 13px; cursor:pointer;}
.album-head:hover{background:var(--panel-3);}
.album-cover{
  width:42px; height:42px; border-radius:8px; flex:none;
  display:grid; place-items:center; font-family:var(--disp); font-weight:800; font-size:17px; color:#fff;
}
.album-meta{flex:1; min-width:0;}
.album-title{font-weight:700; font-size:14px;}
.album-sub{color:var(--muted); font-size:12px; letter-spacing:.02em;}
.album-caret{color:var(--muted-2); transition:.2s;}
.album.open .album-caret{transform:rotate(180deg);}
.track-list{border-top:1px solid var(--line-soft); display:none;}
.album.open .track-list{display:block;}
.track{display:flex; align-items:center; gap:7px; padding:8px 13px; border-bottom:1px solid rgba(255,255,255,.035);}
.track:last-child{border-bottom:none;}
.track:hover{background:rgba(255,255,255,.03);}
.track-name{flex:1; min-width:0;}
.track-name .t{font-size:13px; font-weight:500;}
.track-name .t .star{color:var(--itzy);}
.track-name .kr{color:var(--muted-2); font-size:11px;}
.pill{font-size:10.5px; padding:2px 8px; border-radius:20px; white-space:nowrap; font-weight:600; letter-spacing:.02em;}
.pill.on{color:var(--good); background:rgba(52,211,153,.12); border:1px solid rgba(52,211,153,.3);}
.pill.off{color:var(--muted-2); background:transparent; border:1px solid var(--line);}

/* ---- builder ---- */
.dest{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px;}
.dest select, .tag-sel{
  background:var(--panel-2); border:1px solid var(--line); color:var(--text);
  padding:7px 9px; border-radius:8px; font-size:13px;
}
.dest select:focus{outline:none; border-color:var(--lsf);}

.slot-block{margin-bottom:14px;}
.slot-label{
  font-family:var(--disp); font-size:11px; letter-spacing:.3em; color:var(--muted-2);
  margin-bottom:7px; font-weight:800;
}
.slot{
  min-height:50px; border:1px dashed var(--line); border-radius:12px;
  display:flex; align-items:center; padding:9px 13px; color:var(--muted-2); font-size:13px;
}
.slot.intro{border-color:rgba(255,61,127,.4);}
.slot.outro{border-color:rgba(91,134,255,.4);}

.parts-wrap{display:flex; flex-direction:column; gap:14px; margin-bottom:14px;}
.part{border:1px solid var(--line); border-radius:12px; background:var(--panel-2); overflow:hidden;}
.part-head{display:flex; align-items:center; gap:9px; padding:10px 13px; border-bottom:1px solid var(--line); background:var(--panel-3);}
.part-num{
  font-family:var(--disp); font-weight:800; font-size:12px; color:var(--bg);
  background:linear-gradient(120deg,var(--itzy),var(--lsf));
  width:24px; height:24px; border-radius:7px; display:grid; place-items:center; flex:none;
}
.part-title{flex:1; background:transparent; border:none; color:var(--text); font-weight:700; font-size:14px; border-bottom:1px dashed transparent; padding:2px 0;}
.part-title:focus{outline:none; border-bottom-color:var(--itzy);}
.part-count{color:var(--muted-2); font-size:12px; margin-right:6px; font-variant-numeric:tabular-nums;}
.part-items{padding:8px; display:flex; flex-direction:column; gap:6px; min-height:34px;}
.part-empty{color:var(--muted-2); font-size:12px; text-align:center; padding:12px;}

.item{
  display:flex; align-items:center; gap:9px; padding:7px 10px;
  background:var(--panel); border:1px solid var(--line); border-radius:9px;
}
.item.dragging{opacity:.4;}
.item .idx{color:var(--muted-2); font-size:11px; width:16px; text-align:center; font-variant-numeric:tabular-nums;}
.item-name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; font-weight:500;}
.item-name .g{color:var(--muted-2); font-size:11px; font-weight:400;}
.move{display:flex; flex-direction:column; gap:1px;}
.move button{line-height:1; padding:1px 5px; font-size:9px; border-radius:5px;}
.slot .item{flex:1;}

.stat-bar{
  margin-top:16px; padding-top:14px; border-top:1px solid var(--line);
  color:var(--muted); font-size:12px; display:flex; gap:8px 16px; flex-wrap:wrap; align-items:center;
}
.stat-bar b{color:var(--text); font-variant-numeric:tabular-nums;}
.add-song{width:100%; margin-top:12px;}

/* ---- bottom bar ---- */
.control-bar{
  position:fixed; bottom:0; left:0; right:0; z-index:40;
  display:flex; align-items:center; gap:16px; padding:14px 22px;
  background:rgba(16,16,24,.9); backdrop-filter:blur(14px); border-top:1px solid var(--line);
}
.cb-info{flex:1; min-width:0;}
.cb-title{font-family:var(--disp); font-weight:700; font-size:15px;}
.cb-sub{color:var(--muted); font-size:12px;}
.cb-actions{display:flex; gap:9px; align-items:center;}

/* ---- modal ---- */
.overlay{
  position:fixed; inset:0; z-index:60; background:rgba(5,5,10,.72);
  display:none; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(4px);
}
.overlay.show{display:flex;}
.modal{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:22px; max-width:560px; width:100%; max-height:86vh; overflow:auto;}
.modal h3{font-size:18px; margin-bottom:6px;}
.modal p{color:var(--muted); font-size:13px; margin:0 0 14px;}
.modal label{display:block; font-size:12px; color:var(--muted); margin:12px 0 5px; letter-spacing:.02em;}
.modal input[type=text], .modal textarea{
  width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
  padding:10px 12px; border-radius:var(--r-sm); font-size:13px;
}
.modal textarea{min-height:150px; resize:vertical; font-family:ui-monospace,monospace; font-size:12px;}
.modal input:focus, .modal textarea:focus{outline:none; border-color:var(--lsf);}
.modal-actions{display:flex; gap:9px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap;}
.hint{font-size:12px; color:var(--muted-2); margin-top:8px;}
.tag-badge{font-size:11px; padding:2px 8px; border-radius:20px; white-space:nowrap; font-weight:600;}
.hidden{display:none!important;}
</style>

      <div class="slot-label">OUTRO</div>
      <div id="outroSlot" class="slot outro"></div>
    </div>
    <div class="stat-bar" id="statBar"></div>

</main>

<div class="control-bar">
  <div class="cb-info">

<!-- 补音源 modal -->
<div class="overlay" id="audioOverlay">
  <div class="modal">
    <h3 id="audioTitle">设置音源</h3>

      <button class="btn btn-ghost" id="audioCancel">取消</button>
      <button class="btn btn-primary" id="audioSave">保存</button>

  </div>
</div>

<!-- 导出 modal -->
<div class="overlay" id="exportOverlay">
  <div class="modal">
    <h3>导出歌单</h3>

      <button class="btn btn-primary" id="exportClose">完成</button>
    </div>
  </div>
</div>

<!-- 导入 modal -->
<div class="overlay" id="importOverlay">
  <div class="modal">
    <h3>导入歌单</h3>

    <textarea id="importText" placeholder='{"concert":...}'></textarea>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="importCancel">取消</button>
      <button class="btn btn-primary" id="importDo">导入</button>
    </div>
  </div>
</div>

<!-- 手动加歌 modal -->
<div class="overlay" id="addOverlay">
  <div class="modal">
    <h3>手动添加一首歌</h3>
    <p id="addGroupHint"></p>
    <label>歌名</label>
    <input type="text" id="addTitle" placeholder="歌名">
    <label>YouTube 链接（可留空，之后再补）</label>
    <input type="text" id="addLink" placeholder="https://youtu.be/…">
    <div class="modal-actions">
      <button class="btn btn-ghost" id="addCancel">取消</button>
      <button class="btn btn-primary" id="addDo">添加</button>
    </div>
  </div>
</div>

/* ======================= 组合曲库 ======================= */
function groupAlbums(gid){
  const base=(LIBRARY[gid]?.albums||[]).map(al=>({...al,tracks:al.tracks.map(tr=>{
    const k=key(gid,al.title,tr.title);
    return {...tr, yt:overrides[k]??tr.yt??"", _album:al.title};
  })}));
  const mine=custom.filter(c=>c.group===gid);
  if(mine.length){
    const by={}; mine.forEach(c=>{(by[c.album||"自定义"]??=[]).push(c);});
    Object.entries(by).forEach(([al,list])=>base.push({title:al,year:"",type:"自定义",tracks:
      list.map(c=>({title:c.title, yt:overrides[key(gid,al,c.title)]??c.yt??"", _album:al}))}));
  }
  return base;
}
function resolveYt(gid,al,t){
  const k=key(gid,al,t);
  if(overrides[k]!=null)return overrides[k];
  const A=(LIBRARY[gid]?.albums||[]).find(a=>a.title===al);
  const tr=A?.tracks.find(x=>x.title===t);
  if(tr)return tr.yt||"";
  return custom.find(c=>c.group===gid&&(c.album||"自定义")===al&&c.title===t)?.yt||"";
}
const ytWatch=id=>`https://www.youtube.com/watch?v=${id}`;
function parseYt(u){u=(u||"").trim(); if(/^[\w-]{11}$/.test(u))return u;
  const m=u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m?m[1]:"";}

/* ======================= 曲库渲染 ======================= */
function renderTabs(){
  const w=$("#groupTabs"); w.innerHTML="";
  Object.entries(LIBRARY).forEach(([id,g])=>{
    const b=document.createElement("div");
    b.className="group-tab"+(id===currentGroup?" active":"");
    b.textContent=g.name;
    if(id===currentGroup) b.style.background=g.color;
    b.onclick=()=>{currentGroup=id; renderTabs(); renderLib();};
    w.appendChild(b);
  });
}
function renderLib(){
  const q=$("#search").value.trim().toLowerCase();
  const list=$("#albumList"); list.innerHTML="";
  const gc=LIBRARY[currentGroup].color;
  groupAlbums(currentGroup).forEach(al=>{
    const trs=al.tracks.filter(t=>!q||t.title.toLowerCase().includes(q)||al.title.toLowerCase().includes(q)||(t.title_kr&&t.title_kr.includes(q)));
    if(!trs.length)return;
    const A=document.createElement("div"); A.className="album"+(q?" open":"");
    const h=document.createElement("div"); h.className="album-head";
    h.innerHTML=`<div class="album-cover" style="background:linear-gradient(135deg,${gc},${gc}99)">${esc(al.title.slice(0,1))}</div>
      <div class="album-meta"><div class="album-title">${esc(al.title)}</div>
      <div class="album-sub">${al.year?al.year+" · ":""}${al.type} · ${al.tracks.length} 首</div></div>
      <div class="album-caret">▾</div>`;
    h.onclick=()=>A.classList.toggle("open");
    A.appendChild(h);
    const tl=document.createElement("div"); tl.className="track-list";
    trs.forEach(tr=>tl.appendChild(trackRow(tr,al)));
    A.appendChild(tl); list.appendChild(A);
  });
  if(!list.children.length) list.innerHTML=`<div class="part-empty">没有匹配的歌曲</div>`;
}
function trackRow(tr,al){
  const row=document.createElement("div"); row.className="track";
  const on=!!tr.yt;
  row.innerHTML=`<div class="track-name"><div class="t">${tr.lead?'<span class="star">★</span> ':""}${esc(tr.title)}</div>
    ${tr.title_kr?`<div class="kr">${esc(tr.title_kr)}</div>`:""}</div>
    <span class="pill ${on?"on":"off"}">${on?"♪ 有音源":"无音源"}</span>`;
  // play (anchor if has audio)
  let play;
  if(on){ play=document.createElement("a"); play.className="btn mini"; play.textContent="▶";
    play.href=ytWatch(tr.yt); play.target="_blank"; play.rel="noopener"; play.title="在 YouTube 试听"; }
  else { play=document.createElement("button"); play.className="btn mini"; play.textContent="▶";
    play.title="先设置音源"; play.onclick=()=>openAudio(currentGroup,tr._album,tr.title); }
  const link=document.createElement("button"); link.className="btn mini";
  link.textContent=on?"🔗":"🔎"; link.title=on?"换音源":"找音源";
  link.onclick=()=>openAudio(currentGroup,tr._album,tr.title);
  const add=document.createElement("button"); add.className="btn mini"; add.textContent="＋"; add.title="加入演唱会";
  add.onclick=()=>addTo(tr,al);
  row.append(play,link,add);
  return row;
}

/* ======================= 编排 ======================= */
function makeItem(tr,al){return {uid:uid(),group:currentGroup,groupName:LIBRARY[currentGroup].name,
  album:al.title,title:tr.title,yt:resolveYt(currentGroup,al.title,tr.title),tag:"stage"};}
function addTo(tr,al){
  const d=$("#destSelect").value, it=makeItem(tr,al);
  if(d==="intro")concert.intro=it; else if(d==="outro")concert.outro=it;
  else{const p=concert.parts.find(p=>p.id===d); if(p)p.items.push(it);}
  persist(); renderBuilder();
}
function renderDest(){
  const s=$("#destSelect"), prev=s.value; s.innerHTML="";
  const add=(v,l)=>{const o=document.createElement("option");o.value=v;o.textContent=l;s.appendChild(o);};
  add("intro","Intro"); concert.parts.forEach((p,i)=>add(p.id,p.title||`Part ${i+1}`)); add("outro","Outro");
  if([...s.options].some(o=>o.value===prev))s.value=prev;
  else if(concert.parts.length)s.value=concert.parts.at(-1).id;
}
function slotItem(it,kind){
  const el=document.createElement("div"); el.className="item";
  el.innerHTML=`<span class="item-name">${esc(it.title)} <span class="g">· ${esc(it.groupName)}</span></span>`;
  el.append(playBtn(it), smallBtn("✕",()=>{if(kind==="intro")concert.intro=null;else concert.outro=null;persist();renderBuilder();}));
  return el;
}
function playBtn(it){
  if(it.yt){const a=document.createElement("a");a.className="btn mini";a.textContent="▶";
    a.href=ytWatch(it.yt);a.target="_blank";a.rel="noopener";return a;}
  const b=document.createElement("button");b.className="btn mini";b.textContent="🔎";
  b.onclick=()=>openAudio(it.group,it.album,it.title);return b;
}
function smallBtn(t,fn){const b=document.createElement("button");b.className="btn mini";b.textContent=t;b.onclick=fn;return b;}
function partItem(it,part,idx){
  const el=document.createElement("div"); el.className="item"; el.draggable=true; el.dataset.uid=it.uid;
  const i=document.createElement("span");i.className="idx";i.textContent=idx+1;
  const n=document.createElement("span");n.className="item-name";n.innerHTML=`${esc(it.title)} <span class="g">· ${esc(it.groupName)}</span>`;
  const ts=document.createElement("select");ts.className="tag-sel";
  Object.entries(TAGS).forEach(([k,t])=>{const o=document.createElement("option");o.value=k;o.textContent=`${t.emoji} ${t.label}`;if(k===it.tag)o.selected=true;ts.appendChild(o);});
  ts.onchange=()=>{it.tag=ts.value;persist();};
  const mv=document.createElement("span");mv.className="move";
  mv.append(smallBtn("▲",()=>move(part,idx,-1)),smallBtn("▼",()=>move(part,idx,1)));
  const rm=smallBtn("✕",()=>{part.items=part.items.filter(x=>x.uid!==it.uid);persist();renderBuilder();});
  el.append(i,n,ts,mv,playBtn(it),rm);
  el.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",it.uid);el.classList.add("dragging");});
  el.addEventListener("dragend",()=>el.classList.remove("dragging"));
  el.addEventListener("dragover",e=>e.preventDefault());
  el.addEventListener("drop",e=>{e.preventDefault();reorder(part,e.dataTransfer.getData("text/plain"),it.uid);});
  return el;
}
function move(p,idx,d){const j=idx+d;if(j<0||j>=p.items.length)return;[p.items[idx],p.items[j]]=[p.items[j],p.items[idx]];persist();renderBuilder();}
function reorder(p,from,to){if(from===to)return;const a=p.items.findIndex(x=>x.uid===from),b=p.items.findIndex(x=>x.uid===to);if(a<0||b<0)return;const[m]=p.items.splice(a,1);p.items.splice(b,0,m);persist();renderBuilder();}
function renderBuilder(){
  renderDest();
  const iS=$("#introSlot");iS.innerHTML="";
  concert.intro?iS.appendChild(slotItem(concert.intro,"intro")):iS.textContent="空 — 选「添加到 Intro」后从曲库点 ＋";
  const oS=$("#outroSlot");oS.innerHTML="";
  concert.outro?oS.appendChild(slotItem(concert.outro,"outro")):oS.textContent="空 — 选「添加到 Outro」后从曲库点 ＋";
  const w=$("#partsWrap");w.innerHTML="";
  concert.parts.forEach((p,pi)=>{
    const box=document.createElement("div");box.className="part";
    const h=document.createElement("div");h.className="part-head";
    const num=document.createElement("span");num.className="part-num";num.textContent=pi+1;
    const ti=document.createElement("input");ti.className="part-title";ti.value=p.title||`Part ${pi+1}`;
    ti.oninput=()=>{p.title=ti.value;persist();renderDest();};
    const c=document.createElement("span");c.className="part-count";c.textContent=`${p.items.length} 首`;
    const del=smallBtn("删除",()=>{if(concert.parts.length<=1){alert("至少保留一个 Part");return;}
      if(p.items.length&&!confirm(`删除「${p.title}」及其 ${p.items.length} 首歌？`))return;
      concert.parts=concert.parts.filter(x=>x.id!==p.id);persist();renderBuilder();});
    del.classList.add("btn-ghost");
    h.append(num,ti,c,del);
    const items=document.createElement("div");items.className="part-items";
    if(!p.items.length){const e=document.createElement("div");e.className="part-empty";e.textContent="从左边曲库点 ＋ 加进来";items.appendChild(e);}
    else p.items.forEach((it,idx)=>items.appendChild(partItem(it,p,idx)));
    box.append(h,items);w.appendChild(box);
  });
  renderStats(); updatePlayAll();
}
function collect(withNo=false){const q=[];if(concert.intro)q.push(concert.intro);
  concert.parts.forEach(p=>p.items.forEach(i=>q.push(i)));if(concert.outro)q.push(concert.outro);
  return withNo?q:q.filter(i=>i.yt);}
function renderStats(){
  const all=collect(true),withA=all.filter(i=>i.yt).length;
  const c={stage:0,float:0,patrol:0,fansa:0};
  concert.parts.forEach(p=>p.items.forEach(i=>c[i.tag]=(c[i.tag]||0)+1));
  $("#statBar").innerHTML=`<span>总曲目 <b>${all.length}</b></span><span>有音源 <b>${withA}</b></span>`+
    `<span>Part <b>${concert.parts.length}</b></span>`+
    Object.entries(TAGS).map(([k,t])=>`<span>${t.emoji} ${t.label} <b>${c[k]||0}</b></span>`).join("");
}
function updatePlayAll(){
  const q=collect(false), ids=q.map(i=>i.yt).slice(0,50);
  const url=ids.length?`https://www.youtube.com/watch_videos?video_ids=${ids.join(",")}`:"";
  const a=$("#playAllBtn2");
  if(url){a.href=url;a.style.opacity="1";a.style.pointerEvents="auto";}
  else{a.removeAttribute("href");a.style.opacity=".5";a.style.pointerEvents="none";}
}

/* ======================= modal 交互 ======================= */
let audioCtx=null;
function openAudio(g,al,t){
  audioCtx={g,al,t};
  $("#audioTitle").textContent=`音源：${t}`;
  $("#audioSearch").href="https://www.youtube.com/results?search_query="+encodeURIComponent(`${LIBRARY[g].name} ${t} official MV`);
  $("#audioInput").value=(()=>{const y=resolveYt(g,al,t);return y?`https://youtu.be/${y}`:"";})();
  show("#audioOverlay");
}
function saveAudio(){
  if(!audioCtx)return; const{g,al,t}=audioCtx; const raw=$("#audioInput").value; const k=key(g,al,t);
  if(raw.trim()===""){delete overrides[k];}
  else{const id=parseYt(raw); if(!id){alert("没识别出 YouTube 链接");return;} overrides[k]=id;}
  jsave(LS.overrides,overrides); hide("#audioOverlay"); renderLib(); renderBuilder();
}
function show(s){$(s).classList.add("show");} function hide(s){$(s).classList.remove("show");}

function doExport(){
  const L=[]; L.push(`🎤 ${concert.name||"My Concert"}`); L.push("═".repeat(24));
  if(concert.intro)L.push(`[INTRO] ${concert.intro.title} — ${concert.intro.groupName}`);
  concert.parts.forEach((p,i)=>{L.push("");L.push(`▸ ${p.title||"Part "+(i+1)}`);
    p.items.forEach((it,j)=>{const t=TAGS[it.tag];L.push(`   ${j+1}. ${it.title} — ${it.groupName}  ${t.emoji}${t.label}`);});});
  if(concert.outro){L.push("");L.push(`[OUTRO] ${concert.outro.title} — ${concert.outro.groupName}`);}
  $("#exportText").value=L.join("\n");
  $("#exportJson").value=JSON.stringify({concert,overrides,custom});
  show("#exportOverlay");
}
function copyFrom(sel){const el=$(sel);el.select();try{document.execCommand("copy");}catch{}
  try{navigator.clipboard?.writeText(el.value);}catch{}}
function doImport(){
  try{const d=JSON.parse($("#importText").value);
    if(d.concert)concert=d.concert;
    if(d.overrides){overrides=d.overrides;jsave(LS.overrides,overrides);}
    if(d.custom){custom=d.custom;jsave(LS.custom,custom);}
    persist();$("#concertName").value=concert.name||"";renderTabs();renderLib();renderBuilder();
    hide("#importOverlay");
  }catch{alert("解析失败，请确认是本工具导出的存档 JSON");}
}

/* ======================= init ======================= */
function init(){
  $("#concertName").value=concert.name||"";
  $("#concertName").oninput=e=>{concert.name=e.target.value;persist();};
  $("#playAllBtn").onclick=()=>{const a=$("#playAllBtn2");if(a.getAttribute("href")){a.click();}else alert("还没有可播放的歌，先给歌配 YouTube 链接。");};
  $("#exportBtn").onclick=doExport;
  $("#importBtn").onclick=()=>{$("#importText").value="";show("#importOverlay");};
  $("#resetBtn").onclick=()=>{if(!confirm("清空当前编排？（曲库和你补的音源会保留）"))return;
    concert={name:"",intro:null,parts:[{id:uid(),title:"Part 1",items:[]}],outro:null};persist();$("#concertName").value="";renderBuilder();};
  $("#addPartBtn").onclick=()=>{concert.parts.push({id:uid(),title:`Part ${concert.parts.length+1}`,items:[]});persist();renderBuilder();};
  $("#search").oninput=renderLib;
  $("#addSongBtn").onclick=()=>{$("#addGroupHint").textContent=`添加到 ${LIBRARY[currentGroup].name}（归入「自定义」专辑）`;
    $("#addTitle").value="";$("#addLink").value="";show("#addOverlay");};
  // modal buttons
  $("#audioSave").onclick=saveAudio; $("#audioCancel").onclick=()=>hide("#audioOverlay");
  $("#exportClose").onclick=()=>hide("#exportOverlay");
  $("#copyText").onclick=()=>copyFrom("#exportText"); $("#copyJson").onclick=()=>copyFrom("#exportJson");
  $("#importCancel").onclick=()=>hide("#importOverlay"); $("#importDo").onclick=doImport;
  $("#addCancel").onclick=()=>hide("#addOverlay");
  $("#addDo").onclick=()=>{const t=$("#addTitle").value.trim();if(!t)return;
    custom.push({group:currentGroup,album:"自定义",title:t,yt:parseYt($("#addLink").value)});
    jsave(LS.custom,custom);hide("#addOverlay");renderLib();};
  document.querySelectorAll(".overlay").forEach(o=>o.addEventListener("click",e=>{if(e.target===o)o.classList.remove("show");}));
  renderTabs(); renderLib(); renderBuilder();
}
document.addEventListener("DOMContentLoaded",init);
</script>
