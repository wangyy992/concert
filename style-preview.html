<title>Concert Builder 风格选型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Unbounded:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box;}
html,body{margin:0;}
body{
  background:#0c0d12; color:#e9e9f0;
  font-family:"Archivo",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
  padding:32px 20px 64px; line-height:1.5;
}
.head{max-width:1200px;margin:0 auto 26px;}
.head h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;margin:0 0 6px;letter-spacing:-.01em;}
.head p{margin:0;color:#9a9ab0;font-size:14px;max-width:70ch;}
.grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;}
@media(max-width:760px){.grid{grid-template-columns:1fr;}}
.cell{display:flex;flex-direction:column;gap:12px;}
.cap{display:flex;flex-direction:column;gap:3px;}
.cap .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7c7c94;font-weight:600;}
.cap h2{margin:0;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:18px;}
.cap p{margin:0;color:#9a9ab0;font-size:13px;}
.cap .fit{color:#6f6e86;font-size:12px;}

/* device frame */
.frame{border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.08);box-shadow:0 14px 40px rgba(0,0,0,.45);height:520px;display:flex;flex-direction:column;}
.m-top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;}
.m-brand{font-weight:800;}
.m-pill{font-size:12px;padding:5px 12px;border-radius:20px;font-weight:700;}
.m-body{flex:1;overflow:hidden;padding:0 16px;display:flex;flex-direction:column;gap:12px;}
.m-album{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;}
.m-cover{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;}
.m-atitle{font-weight:700;font-size:15px;}
.m-asub{font-size:12px;opacity:.7;}
.m-track{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:10px;font-size:13px;}
.m-actions{display:flex;gap:7px;}
.m-actions i{font-style:normal;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:12px;}
.m-sec{font-size:11px;letter-spacing:.24em;font-weight:800;opacity:.65;padding-top:2px;}
.m-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600;}
.m-chip{font-size:10.5px;padding:2px 9px;border-radius:20px;font-weight:700;}
.m-player{margin-top:auto;display:flex;align-items:center;gap:11px;padding:12px 16px;}
.m-pcover{width:38px;height:38px;border-radius:8px;object-fit:cover;flex:none;}
.m-pinfo{flex:1;display:flex;flex-direction:column;line-height:1.25;}
.m-pinfo b{font-size:13px;}
.m-pinfo span{font-size:11px;opacity:.65;}
.m-pplay{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;}

/* ============ 当前：暗色霓虹 ============ */
.cur .frame{background:#0b0b12;background-image:radial-gradient(50% 30% at 15% 0,rgba(255,61,127,.18),transparent 70%),radial-gradient(50% 30% at 85% 0,rgba(91,134,255,.18),transparent 70%);font-family:"Archivo",sans-serif;}
.cur .m-brand{background:linear-gradient(120deg,#ff3d7f,#5b86ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
.cur .m-pill{background:linear-gradient(120deg,#ff3d7f,#ff5c93);color:#fff;box-shadow:0 4px 14px rgba(255,61,127,.35);}
.cur .m-album{background:#1b1b28;border:1px solid #2c2c3d;}
.cur .m-track{background:#14141f;border:1px solid #23232f;}
.cur .m-actions .play{color:#34d399;border:1px solid rgba(52,211,153,.4);}
.cur .m-actions .add{color:#ff3d7f;border:1px solid rgba(255,61,127,.4);}
.cur .m-sec{font-family:"Bricolage Grotesque",sans-serif;color:#6f6e86;}
.cur .m-item{background:#14141f;border:1px solid #2c2c3d;}
.cur .m-chip{background:rgba(154,160,181,.18);color:#c9c8d6;}
.cur .m-player{background:rgba(16,16,24,.92);border-top:1px solid #2c2c3d;}
.cur .m-pplay{background:linear-gradient(120deg,#ff3d7f,#ff5c93);color:#fff;}

/* ============ A 杂志亮色 ============ */
.A .frame{background:#f7f6f2;color:#191921;font-family:"Instrument Sans",sans-serif;}
.A .m-top{border-bottom:1px solid #e7e5df;}
.A .m-brand{font-family:"Fraunces",serif;font-weight:700;color:#191921;}
.A .m-pill{background:#191921;color:#fff;}
.A .m-album{background:#fff;border:1px solid #ececE6;box-shadow:0 4px 14px rgba(0,0,0,.04);}
.A .m-cover{width:64px;height:64px;}
.A .m-atitle{font-family:"Fraunces",serif;font-weight:700;font-size:17px;}
.A .m-asub{color:#8a897f;}
.A .m-track{background:transparent;border-bottom:1px solid #ececE6;border-radius:0;}
.A .m-actions .play{color:#c8365f;border:1px solid #eccdd6;background:#fbeef1;}
.A .m-actions .add{color:#191921;border:1px solid #e0ddd4;}
.A .m-sec{font-family:"Fraunces",serif;letter-spacing:.1em;color:#c8365f;opacity:1;font-weight:700;font-style:italic;}
.A .m-item{background:#fff;border:1px solid #ececE6;}
.A .m-chip{background:#f0ead9;color:#8a6d1f;}
.A .m-player{background:#191921;color:#fff;}
.A .m-pplay{background:#fff;color:#191921;}

/* ============ B 霓虹海报 ============ */
.B .frame{background:#050308;color:#fff;font-family:"Archivo",sans-serif;position:relative;}
.B .frame::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 40% at 50% -5%,rgba(255,30,120,.5),transparent 60%),radial-gradient(50% 40% at 100% 30%,rgba(124,60,255,.45),transparent 60%),radial-gradient(50% 40% at 0 60%,rgba(0,180,255,.35),transparent 60%);pointer-events:none;}
.B .m-top,.B .m-body,.B .m-player{position:relative;z-index:1;}
.B .m-brand{font-family:"Unbounded",sans-serif;font-weight:800;font-size:15px;text-transform:uppercase;}
.B .m-pill{background:#fff;color:#111;font-weight:800;text-transform:uppercase;letter-spacing:.04em;}
.B .m-album{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);}
.B .m-atitle{font-family:"Unbounded",sans-serif;font-weight:800;font-size:15px;letter-spacing:-.01em;}
.B .m-track{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);text-transform:uppercase;letter-spacing:.02em;font-weight:600;font-size:12px;}
.B .m-actions .play{color:#0ff;border:1px solid rgba(0,255,255,.5);}
.B .m-actions .add{color:#ff2e78;border:1px solid rgba(255,46,120,.55);}
.B .m-sec{font-family:"Unbounded",sans-serif;color:#ff2e78;opacity:1;}
.B .m-item{background:linear-gradient(90deg,rgba(255,46,120,.16),rgba(124,60,255,.12));border:1px solid rgba(255,46,120,.4);text-transform:uppercase;}
.B .m-chip{background:#ff2e78;color:#fff;}
.B .m-player{background:rgba(5,3,8,.7);backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.12);}
.B .m-pplay{background:linear-gradient(120deg,#ff2e78,#7c3cff);color:#fff;box-shadow:0 0 18px rgba(255,46,120,.6);}

/* ============ C 玻璃拟态 ============ */
.C .frame{color:#fff;font-family:"Archivo",sans-serif;position:relative;background:#141024;}
.C .frame::before{content:"";position:absolute;inset:0;background:
  radial-gradient(40% 30% at 20% 20%,#ff5ca8,transparent 60%),
  radial-gradient(45% 35% at 85% 25%,#5b86ff,transparent 60%),
  radial-gradient(50% 40% at 60% 90%,#9b5cff,transparent 60%),
  radial-gradient(40% 30% at 10% 80%,#22d3ee,transparent 60%);
  filter:saturate(1.1);}
.C .m-top,.C .m-body,.C .m-player{position:relative;z-index:1;}
.C .m-brand{font-weight:800;}
.C .glass,.C .m-album,.C .m-track,.C .m-item,.C .m-pill,.C .m-player{background:rgba(255,255,255,.14);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.25);}
.C .m-pill{padding:6px 13px;font-weight:700;color:#fff;}
.C .m-album{box-shadow:0 8px 24px rgba(0,0,0,.18);}
.C .m-atitle{font-weight:700;}
.C .m-track{font-weight:500;}
.C .m-actions i{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.3);}
.C .m-sec{opacity:.9;text-shadow:0 1px 6px rgba(0,0,0,.2);}
.C .m-chip{background:rgba(255,255,255,.28);color:#fff;border:1px solid rgba(255,255,255,.4);}
.C .m-player{border-radius:0;border-left:none;border-right:none;border-bottom:none;}
.C .m-pplay{background:#fff;color:#7c3cff;}
</style>

<div class="head">
  <h1>Concert Builder · 风格选型</h1>
  <p>同一套界面切片（曲库专辑 + 曲目 + 编排项 + 播放条）用四种风格渲染，方便对比。看中哪个告诉我编号，我就把整站改成那套；也可以混搭（比如"霓虹海报的标题 + 玻璃卡片"）。</p>
</div>
